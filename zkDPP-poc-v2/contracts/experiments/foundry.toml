[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
code_size_limit = 24576
# Test functions replay many distinct transactions; actual Anvil tx stay <=30M.
gas_limit = 1000000000
fs_permissions = [{access="read",path="./test/fixtures"}]
