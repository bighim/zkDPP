services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    platform: linux/arm64
    entrypoint: [anvil]
    command: [--host, "0.0.0.0", --hardfork, prague, --chain-id, "31337", --gas-limit, "30000000", --steps-tracing]
    ports: ["127.0.0.1:18546:8545"]
  foundry:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    platform: linux/arm64
    working_dir: /workspace/contracts/hotfix
    volumes: [".:/workspace"]
    entrypoint: [forge]
