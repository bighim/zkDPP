services:
  anvil:
    image: ${FOUNDRY_IMAGE:-ghcr.io/foundry-rs/foundry:v1.7.1}
    platform: linux/arm64
    entrypoint: [""]
    command:
      - anvil
      - --host
      - 0.0.0.0
      - --hardfork
      - prague
      - --chain-id
      - "31337"
      - --timestamp
      - "60000"
      - --gas-limit
      - "30000000"
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 1s
      timeout: 2s
      retries: 30

  foundry:
    image: ${FOUNDRY_IMAGE:-ghcr.io/foundry-rs/foundry:v1.7.1}
    platform: linux/arm64
    working_dir: /workspace/contracts
    volumes:
      - .:/workspace
    entrypoint: [""]

  validator1: &besu-validator
    image: hyperledger/besu@sha256:5c319f8f5f3449438c03ea7fa2c9bf24b866dc55ac98d802bb41ad793e740587
    platform: linux/arm64
    profiles: ["besu"]
    user: "0:0"
    env_file:
      - ./besu/data/besu.env
    volumes:
      - ./besu/generated/genesis.json:/network/genesis.json:ro
      - ./besu/data/validator1:/var/lib/besu
    command:
      - --data-path=/var/lib/besu/database
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/var/lib/besu/key.priv
      - --discovery-enabled=false
      - --static-nodes-file=/var/lib/besu/static-nodes.json
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --host-allowlist=*
      - --min-gas-price=0
      - --permissions-nodes-config-file-enabled
      - --permissions-nodes-config-file=/var/lib/besu/permissions_config.toml
      - --permissions-accounts-config-file-enabled
      - --permissions-accounts-config-file=/var/lib/besu/permissions_config.toml
      - --Xdns-enabled=true

  validator2:
    <<: *besu-validator
    volumes:
      - ./besu/generated/genesis.json:/network/genesis.json:ro
      - ./besu/data/validator2:/var/lib/besu

  validator3:
    <<: *besu-validator
    volumes:
      - ./besu/generated/genesis.json:/network/genesis.json:ro
      - ./besu/data/validator3:/var/lib/besu

  validator4:
    <<: *besu-validator
    volumes:
      - ./besu/generated/genesis.json:/network/genesis.json:ro
      - ./besu/data/validator4:/var/lib/besu

  rpc:
    <<: *besu-validator
    ports:
      - "${BESU_PORT:-9545}:8545"
    volumes:
      - ./besu/generated/genesis.json:/network/genesis.json:ro
      - ./besu/data/rpc:/var/lib/besu
    command:
      - --data-path=/var/lib/besu/database
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/var/lib/besu/key.priv
      - --discovery-enabled=false
      - --static-nodes-file=/var/lib/besu/static-nodes.json
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --host-allowlist=*
      - --min-gas-price=0
      - --permissions-nodes-config-file-enabled
      - --permissions-nodes-config-file=/var/lib/besu/permissions_config.toml
      - --permissions-accounts-config-file-enabled
      - --permissions-accounts-config-file=/var/lib/besu/permissions_config.toml
      - --Xdns-enabled=true
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,QBFT,PERM,ADMIN
      - --rpc-http-cors-origins=*
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8545'"]
      interval: 1s
      timeout: 2s
      retries: 60

  unauthorized:
    image: hyperledger/besu@sha256:5c319f8f5f3449438c03ea7fa2c9bf24b866dc55ac98d802bb41ad793e740587
    platform: linux/arm64
    profiles: ["besu-negative"]
    user: "0:0"
    ports:
      - "${BESU_UNAUTH_PORT:-9546}:8545"
    volumes:
      - ./besu/generated/genesis.json:/network/genesis.json:ro
      - ./besu/data/unauthorized:/var/lib/besu
    command:
      - --data-path=/var/lib/besu/database
      - --genesis-file=/network/genesis.json
      - --node-private-key-file=/var/lib/besu/key.priv
      - --discovery-enabled=false
      - --static-nodes-file=/var/lib/besu/static-nodes.json
      - --p2p-host=0.0.0.0
      - --p2p-port=30303
      - --host-allowlist=*
      - --min-gas-price=0
      - --Xdns-enabled=true
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,WEB3,ADMIN
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/8545'"]
      interval: 1s
      timeout: 2s
      retries: 60
