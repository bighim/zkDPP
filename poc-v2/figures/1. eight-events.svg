<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Eight zkDPP events</title>
  <desc id="desc">Exact protocol-object transitions for Entry, Transfer, Proceed, Recall, Merge, Split, Process and Exit.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#263238"/></marker>
    <style>.t{font-family:Inter,Pretendard,Arial,sans-serif;fill:#17252a;letter-spacing:0}.h{font-size:34px;font-weight:700}.sh{font-size:24px;font-weight:700}.b{font-size:17px}.sm{font-size:14px}.muted{fill:#647277}.card{fill:#fff;stroke:#aebdc1;stroke-width:2}.cm{fill:#e6f4f3;stroke:#0d6268;stroke-width:3}.rv{fill:#fff0ef;stroke:#b63a32;stroke-width:3}.line{fill:none;stroke:#263238;stroke-width:3;marker-end:url(#a)}.check{fill:#f4f7f7;stroke:#d2dcde;stroke-width:1}</style>
    <g id="cm"><rect class="cm" width="84" height="98" rx="6"/><text class="t sh" x="42" y="59" text-anchor="middle">cm</text></g>
    <g id="rv"><rect class="rv" width="84" height="98" rx="6"/><text class="t sh" x="42" y="59" text-anchor="middle">rv</text></g>
    <g id="cmSmall"><rect class="cm" width="58" height="68" rx="5"/><text class="t b" x="29" y="41" text-anchor="middle">cm</text></g>
    <g id="cmTiny"><rect class="cm" width="48" height="50" rx="5"/><text class="t sm" x="24" y="31" text-anchor="middle">cm</text></g>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text class="t h" x="55" y="57">Eight zkDPP State-Transition Events</text>
  <text class="t b muted" x="55" y="88">Each panel separates consumed protocol objects, generated objects, and the contract state update.</text>

  <g transform="translate(45 125)"><rect class="card" width="360" height="330" rx="6"/><text class="t sh" x="24" y="38">1. Entry</text><text class="t b muted" x="24" y="67">new product enters the supply chain</text><circle cx="72" cy="150" r="35" fill="none" stroke="#718085" stroke-width="3" stroke-dasharray="7 7"/><line class="line" x1="115" y1="150" x2="218" y2="150"/><use href="#cm" x="235" y="101"/><text class="t b" x="180" y="225" text-anchor="middle">∅ → cm_new</text><rect class="check" x="24" y="255" width="312" height="50" rx="4"/><text class="t sm" x="180" y="286" text-anchor="middle">proof verify · List_cm insert · MT append</text></g>

  <g transform="translate(425 125)"><rect class="card" width="360" height="330" rx="6"/><text class="t sh" x="24" y="38">2. Transfer</text><text class="t b muted" x="24" y="67">recall-default ownership transfer</text><use href="#cm" x="24" y="103"/><path class="line" d="M120 152H170V112H218"/><path class="line" d="M170 152V220H218"/><use href="#cm" x="235" y="63"/><use href="#rv" x="235" y="171"/><text class="t b" x="180" y="282" text-anchor="middle">cm_old → cm_change + rv</text><text class="t sm muted" x="180" y="309" text-anchor="middle">MT append + rvMT append + deadline</text></g>

  <g transform="translate(805 125)"><rect class="card" width="360" height="330" rx="6"/><text class="t sh" x="24" y="38">3. Proceed</text><text class="t b muted" x="24" y="67">receiver finalizes an unresolved voucher</text><use href="#rv" x="35" y="103"/><line class="line" x1="132" y1="152" x2="225" y2="152"/><use href="#cm" x="242" y="103"/><text class="t b" x="180" y="225" text-anchor="middle">rv → cm_receiver</text><rect class="check" x="24" y="255" width="312" height="50" rx="4"/><text class="t sm" x="180" y="278" text-anchor="middle">rvnf unused · receiver authorization</text><text class="t sm" x="180" y="298" text-anchor="middle">List_rvnf insert · MT append</text></g>

  <g transform="translate(1185 125)"><rect class="card" width="360" height="330" rx="6"/><text class="t sh" x="24" y="38">4. Recall</text><text class="t b muted" x="24" y="67">sender resolves before the deadline</text><use href="#rv" x="35" y="103"/><line class="line" x1="132" y1="152" x2="225" y2="152"/><use href="#cm" x="242" y="103"/><text class="t b" x="180" y="225" text-anchor="middle">rv → cm_return</text><rect class="check" x="24" y="255" width="312" height="50" rx="4"/><text class="t sm" x="180" y="278" text-anchor="middle">current_epoch &lt; deadline</text><text class="t sm" x="180" y="298" text-anchor="middle">List_rvnf insert · MT append</text></g>

  <g transform="translate(45 490)"><rect class="card" width="360" height="330" rx="6"/><text class="t sh" x="24" y="38">5. Merge</text><text class="t b muted" x="24" y="67">two compatible lots become one</text><use href="#cmSmall" x="30" y="94"/><use href="#cmSmall" x="30" y="182"/><path class="line" d="M98 128H170V172H236"/><path d="M98 216H170V172" fill="none" stroke="#263238" stroke-width="3"/><use href="#cmSmall" x="252" y="138"/><text class="t b" x="180" y="274" text-anchor="middle">cm_old,1 + cm_old,2 → cm_new</text><text class="t sm muted" x="180" y="305" text-anchor="middle">nf × 2 · aggregate consistency · MT append</text></g>

  <g transform="translate(425 490)"><rect class="card" width="360" height="330" rx="6"/><text class="t sh" x="24" y="38">6. Split</text><text class="t b muted" x="24" y="67">one lot becomes two proportional lots</text><use href="#cmSmall" x="30" y="138"/><path class="line" d="M98 172H170V128H236"/><path class="line" d="M170 172V216H236"/><use href="#cmSmall" x="252" y="94"/><use href="#cmSmall" x="252" y="182"/><text class="t b" x="180" y="274" text-anchor="middle">cm_old → cm_new,1 + cm_new,2</text><text class="t sm muted" x="180" y="305" text-anchor="middle">deterministic remainder · exact State sum</text></g>

  <g transform="translate(805 490)"><rect class="card" width="360" height="330" rx="6"/><text class="t sh" x="24" y="38">7. Process</text><text class="t b muted" x="24" y="67">fixed maximum m-to-n transformation</text><use href="#cmTiny" x="18" y="88"/><use href="#cmTiny" x="18" y="150"/><use href="#cmTiny" x="18" y="212"/><path d="M112 106h102l24 62-24 62H112l-24-62z" fill="#0d6268"/><text x="163" y="176" text-anchor="middle" font-family="Inter,Pretendard,Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">P, A</text><path d="M66 113H88M66 175H88M66 237H88M238 113H294M238 175H294M238 237H294" fill="none" stroke="#263238" stroke-width="2"/><use href="#cmTiny" x="294" y="88"/><use href="#cmTiny" x="294" y="150"/><use href="#cmTiny" x="294" y="212"/><text class="t b" x="180" y="282" text-anchor="middle">cm_old[1..m] → cm_new[1..n]</text><text class="t sm muted" x="180" y="310" text-anchor="middle">public P/A · nf × m · MT append × n</text></g>

  <g transform="translate(1185 490)"><rect class="card" width="360" height="330" rx="6"/><text class="t sh" x="24" y="38">8. Exit</text><text class="t b muted" x="24" y="67">product leaves the active protocol</text><use href="#cm" x="35" y="103"/><line class="line" x1="132" y1="152" x2="225" y2="152"/><circle cx="282" cy="152" r="35" fill="none" stroke="#718085" stroke-width="3" stroke-dasharray="7 7"/><text class="t b" x="180" y="225" text-anchor="middle">cm_old → ∅</text><rect class="check" x="24" y="255" width="312" height="50" rx="4"/><text class="t sm" x="180" y="278" text-anchor="middle">membership · ownership · nf correctness</text><text class="t sm" x="180" y="298" text-anchor="middle">List_nf insert · no Tree append</text></g>
</svg>
