    - Proceed four materials to Factory
    - Merge Aluminum A and Aluminum B
    - Freeze and unfreeze one Process input nf
    - Process three Notes into ELIGIBLE and WASTE
    - Split ELIGIBLE output into Product 1 and Product 2
    - Exit Product 1 and WASTE into DPP commitments
    - Issue Standard and Strict Claims for Product 1
    - Reject Issue for WASTE DPP
    - Update Claim statuses
    - Run backward and forward audits
  processAggregate: [320, 30, 230]
  processEligibleOutput: [270, 30, 260]
  processWasteOutput: [30, 0, 0]
  finalState:
    noteLeaves: 19
    voucherLeaves: 5
    auditRecords: 21
    product1StandardClaim: ACTIVE
    product1StrictClaim: REVOKED
    product2: unspent ACTIVE Note
