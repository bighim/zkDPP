[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
solc_version = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read", path = "../artifacts/development/m5" }]
code_size_limit = 1000000
gas_limit = 1000000000

[fmt]
line_length = 100
